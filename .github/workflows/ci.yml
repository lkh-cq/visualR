name: visualR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: R ${{ matrix.config.r }} / ${{ matrix.config.os }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: ubuntu-latest, r: 'devel'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: https://packagemanager.rstudio.com/cran/__linux__/jammy/latest

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'

      - name: R CMD check
        shell: bash
        run: |
          R CMD build .
          R CMD check --no-manual visualR_*.tar.gz

      # CI must be auditable, not just green/red (audit ruling 2026-08-08):
      # on failure, dump the full 00check.log plus test outputs so the
      # next diagnostic starts from the FIRST real ERROR/WARNING block
      # instead of a bare non-zero exit.
      - name: Show R CMD check log on failure
        if: failure()
        shell: bash
        run: |
          echo "===== 00check.log ====="
          find . -name 00check.log -exec sh -c 'echo "--- {} ---"; cat {}' \;
          echo "===== test outputs ====="
          find . -path '*Rcheck/tests/*.Rout*' -exec sh -c 'echo "--- {} ---"; cat {}' \;

      - name: Upload R check evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rcheck-${{ runner.os }}-${{ matrix.config.r }}
          path: |
            **/*.Rcheck/00check.log
            **/*.Rcheck/tests/
          if-no-files-found: ignore

      - name: Install package
        shell: bash
        run: R CMD INSTALL visualR_*.tar.gz

      - name: Concurrency invariant (1 core == N cores)
        shell: bash
        run: Rscript tests/ci-concurrency.R

      - name: Post-install smoke probe (5-step boundary diagnostic)
        shell: bash
        run: Rscript tests/ci-windows-probe.R

      - name: v0.6.2 CPU evidence
        if: runner.os == 'Linux' && matrix.config.r == 'release'
        shell: bash
        run: Rscript .github/scripts/ci-v062-benchmark.R

      - name: Upload v0.6.2 CPU evidence
        if: runner.os == 'Linux' && matrix.config.r == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: v062-cpu-evidence
          path: benchmark-evidence/
          if-no-files-found: error
